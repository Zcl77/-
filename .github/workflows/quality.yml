name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  portable-scripts:
    name: Portable PowerShell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse and test portable scripts
        shell: pwsh
        run: ./scripts/tests/portable-scripts.tests.ps1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  backend:
    name: Django and MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: zhixing_ci
          MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-${{ github.run_id }}-${{ github.run_attempt }} --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DJANGO_SECRET_KEY: ci-${{ github.sha }}-${{ github.run_id }}
      DJANGO_ENVIRONMENT: test
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      MYSQL_DATABASE: zhixing_ci
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install MySQL build dependencies
        run: sudo apt-get update && sudo apt-get install --yes default-libmysqlclient-dev pkg-config
      - run: python -m pip install --requirement requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Test with SQLite
        run: python manage.py test --verbosity 2
        env:
          DJANGO_TEST_SQLITE: 'true'
      - name: Test with MySQL 8.4
        run: python manage.py test --verbosity 2
      - name: Check production security settings
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_ENVIRONMENT: production
          DJANGO_ALLOWED_HOSTS: studio.example.invalid
          DJANGO_CSRF_TRUSTED_ORIGINS: https://studio.example.invalid
          DJANGO_CORS_ALLOWED_ORIGINS: https://studio.example.invalid
          FRONTEND_SITE_URL: https://studio.example.invalid/
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: 'true'
          DJANGO_SECURE_HSTS_PRELOAD: 'true'
