name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  backend:
    name: Django and MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: zhixing_ci
          MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-${{ github.run_id }}-${{ github.run_attempt }} --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DJANGO_SECRET_KEY: ci-${{ github.sha }}-${{ github.run_id }}
      DJANGO_ENVIRONMENT: test
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      MYSQL_DATABASE: zhixing_ci
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install MySQL build dependencies
        run: sudo apt-get update && sudo apt-get install --yes default-libmysqlclient-dev pkg-config
      - run: python -m pip install --requirement requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 2
